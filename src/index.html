<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/dist/output.css" />
    <script defer src="./assets/fontawesome/js/fontawesome.min.js"></script>
    <script defer src="./assets/fontawesome/js/solid.min.js"></script>
    <title>talwind-v4</title>
    <script>
      window.onload = () => {
        const mobileMenuIcon = document.getElementById("mobile-menu-button");
        mobileMenuIcon.addEventListener("click", () => {
          if (mobileMenuIcon.classList.contains("open")) {
            mobileMenuIcon.classList.remove("open");
          } else {
            mobileMenuIcon.classList.add("open");
          }
        });
      };
    </script>
  </head>
  <body>
    <main>
      <header class="text-zinc-200">
        <nav
          class="sticky flex items-center top-0 bg-linear-to-r from-rose-500 to-pink-500"
        >
          <div class="flex items-center p-2 gap-2">
            <img src="./assets/images/logo-inverted.png" width="50" alt="" />
          </div>
          <div class="font-bold text-2xl font-quicksand">Radio Javan</div>

          <div
            id="mobile-nav"
            class="block md:hidden ml-auto my-auto\ pr-4 cursor-pointer"
          >
            <button id="mobile-menu-button" class="group cursor-pointer">
              <div
                class="top-0 transition-all bg-zinc-200 rounded-full w-8 h-1 group-open:rotate-45 group-open:top-2 relative"
              ></div>
              <div
                class="transition-all bg-zinc-200 rounded-full w-8 h-1 mt-1 opacity-100 group-open:opacity-0"
              ></div>
              <div
                class="top-0 transition-all bg-zinc-200 rounded-full w-8 h-1 mt-1 group-open:-rotate-45 group-open:-top-2 relative"
              ></div>
            </button>
          </div>

          <div class="hidden flex-1 md:flex items-center justify-end">
            <div class="menu-item">
              <span>home</span>
            </div>
            <div class="menu-item">
              <span>lineup</span>
            </div>
            <div class="menu-item group">
              <span>tickets</span>
              <div
                class="group-hover:block hidden bg-pink-500 absolute top-full right-0 whitespace-nowrap rounded-b-md text-right"
              >
                <div
                  class="p-4 font-bold hover:bg-white/5 hover:text-zinc-100 transition-colors ease-in-out cursor-pointer text-pink-200"
                >
                  <span>single day ticket</span>
                </div>
                <div
                  class="p-4 font-bold hover:bg-white/5 hover:text-zinc-100 transition-colors ease-in-out text-pink-200"
                >
                  <span>7 day ticket</span>
                </div>
              </div>
            </div>
            <div class="menu-item">
              <span>support</span>
            </div>
          </div>
        </nav>
      </header>
    </main>
  </body>
</html>
